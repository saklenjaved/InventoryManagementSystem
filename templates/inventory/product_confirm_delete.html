{% extends "base.html" %}
{% block title %}Delete product · IMS{% endblock %}
{% block content %}
<div class="page">
  <div class="page-head">
    <h1>Delete product</h1>
    <p class="page-lead muted">This action cannot be undone.</p>
  </div>
  <div class="surface" style="max-width:32rem;">
    <p style="margin:0 0 1.25rem;">Remove <strong>{{ object.name }}</strong> from the catalog?</p>
    <form method="post">{% csrf_token %}
      <div class="actions" style="margin-top:0;">
        <button type="submit" class="btn btn-danger">Delete product</button>
        <a class="btn" href="{% url 'inventory:product_list' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
