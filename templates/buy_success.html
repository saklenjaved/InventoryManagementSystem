<!DOCTYPE html>
<html>
<head>
    <title>Buy Success</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
            padding-top: 100px;
        }

        .box {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        h1 {
            color: green;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #218838;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🎉 Purchase Successful!</h1>

    <p>Your order has been placed successfully.</p>

    <h3>Total Amount: ₹ {{ total }}</h3>

    <a href="{% url 'home' %}" class="btn">Go to Home</a>

    <a href="{% url 'cart' %}" class="btn">View Cart</a>
</div>

</body>
</html>
