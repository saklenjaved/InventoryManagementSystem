{% extends "base.html" %}

{% block content %}
    <div class="container mt-3">
        <div class="row">
            {% for p in product %}
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">
                            
                            {{p.name}}
                        </h5>
                        <h6>
                            {{p.category__name}}
                        </h6>
                        
                        <p class="text-muted"> Stock : {{p.total_stock}}</p>
                        <p class="card-text">
                           Price: ₹ {{p.price}}
                        </p>
                        <a href="{% url 'add_to_cart' p.id %}" class="btn btn-primary">Add To Cart</a>
                    </div>
                </div>
                <br>
                
            </div>
            {% endfor %}
        </div>
    </div>
{% endblock  %}
