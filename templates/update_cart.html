{% extends "base.html" %}

{% block content %}

    <h2>Update Cart Item</h2>

<form method="post">
    {% csrf_token %}

    <label>Product:</label>
    <input type="text" value="{{ form.instance.product.name }}" disabled>

    <br><br>

    <label>Quantity:</label>
    {{ form.quantity }}

    <br><br>

    <button type="submit">Update</button>
</form>

<br>
<a href="{% url 'cart' %}">← Back to Cart</a>
{% endblock  %}
